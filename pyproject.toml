[project]
name = "SteptronOss"
version = "0.0.1"
description = "This is a template repository for Python projects that use uv for their dependency management."
authors = [{ name = "stepfun-ai", email = "henryzhou@stepfun.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp",
    "aioredis",
    "boto3",
    "configurize==0.2.0",
    "einops",
    "fastapi",
    "hjson",
    "ijson",
    "loguru",
    "megfile",
    "msgpack",
    "numpy",
    "packaging",
    "pyyaml",
    "redis",
    "safetensors",
    "setuptools",
    "tabulate",
    "torch==2.9.0",
    "tqdm",
    "transformers<5.0",
    "triton==3.5.0",
    "uvicorn",
    "wandb",
    "httpx",
    "pip>=25.3",
    "vllm>=0.11",
    "tensorboard>=2.20.0",
    "asciichartpy>=1.5.25",
]

[project.optional-dependencies]
mcore = [
    # also need cudnn (https://developer.nvidia.com/cudnn-downloads?target_os=Linux&target_arch=x86_64&Distribution=Ubuntu&target_version=20.04&target_type=deb_network)
    # wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb
    # sudo dpkg -i cuda-keyring_1.1-1_all.deb
    # sudo apt-get update
    # sudo apt-get install cudnn-cuda-12

    # This dependency also needs to be compatible with the spec in Megatron-Bridge/pyproject.toml.
    # It is specified here since we don't directly use Megatron-Bridge/pyproject.toml as the project root,
    # but install mcore via this optional extra.
    "transformer-engine[pytorch]==2.8.0",
    "megatron-core",
    "megatron-bridge",
    # Remove this once https://github.com/NVIDIA-NeMo/RL/issues/501 resolved
    "vllm==0.11.2",
    # Flash-attn version should be selected to satisfy both TE + vLLM requirements (xformers in particular)
    # https://github.com/NVIDIA/TransformerEngine/blob/v2.3/transformer_engine/pytorch/attention/dot_product_attention/utils.py#L108
    # https://github.com/facebookresearch/xformers/blob/8354497deb2c04c67fbb2e2ad911e86530da0e90/xformers/ops/fmha/flash.py#L76
    "flash-attn==2.8.1",
]

[tool.uv]
required-version = ">=0.8.4"
preview = true # Enable preview features like extra-build-dependencies
no-build-isolation-package = [
    "transformer-engine-torch",
    "transformer-engine",
    "flash-attn",
    "mamba-ssm",
    "causal-conv1d",
    "deep_gemm",
    "deep_ep",
    # nv-grouped-gemm: keep build isolation so [tool.uv.extra-build-dependencies] injects setuptools
    # (no-build-isolation + uv lock temp env lacks setuptools and hits prepare_metadata errors)
]
# TE/mcore/flash-attn need build deps available on sync
default-groups = ["dev", "build"]
# Users may use different link-modes depending on their scenario:
#  --link-mode=hardlink (default on linux; may get warnings about switching to --link-mode copy if uv cache and venv on different file-systems)
#  --link-mode=copy (slower but more reliable; supresses warning)
#  --link-mode=symlink (fastest option when uv cache and venv on different file-system; caveat: venv is brittle since it depends on the environment/container)
link-mode = "copy"
# The TE override is needed because automodel/mbridge we are on is still on 2.5.0
# The opencv-python-headless override is needed because automodel pins it to 4.10.0.84, whereas vllm>=0.11.0 needs >= 4.11.0
# The timm override is needed because current automodel pins to 1.0.16. This can be removed once we move ToT automodel
# The nvidia-modelopt override is needed because mcore is still on 0.33
override-dependencies = [
  "transformer-engine[pytorch]==2.8.0",
  "opencv-python-headless>=4.11.0",
  "timm<=1.0.22",
  "nvidia-modelopt[torch]>=0.39.0",
  # Override setuptools range in other dependencies to address CVE GHSA-58pv-8j8x-9vj2
  "setuptools>=80.10.2",
]

[tool.uv.sources]
megatron-core = { workspace = true }
megatron-bridge = { workspace = true }
nv-grouped-gemm = { git = "https://github.com/fanshiqing/grouped_gemm.git" }

[project.urls]
Homepage = "https://Randomizez.github.io/SteptronOss/"
Repository = "https://github.com/Randomizez/SteptronOss"
Documentation = "https://Randomizez.github.io/SteptronOss/"

[tool.uv.workspace]
members = [
  "3rdparty/Megatron-LM-workspace",
  "3rdparty/Megatron-Bridge-workspace",
]

[dependency-groups]
# Build deps for TE / megatron-core / flash-attn (mirrors nemo-rl dependency-groups.build)
build = [
    "torch==2.9.0",
    "setuptools",
    "packaging",
    "einops",
    "hatchling",
    "pybind11",
    "psutil",
    "ninja",
]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.0",
    "tox-uv>=1.29.0",
    "deptry>=0.24.0",
    "mypy>=1.19.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.8",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
    "black",
    "isort",
    "py-spy",
    "debugpy",
    "ipython>=8.38.0",
    "nvitop>=1.6.2",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
transformer-engine = [{ requirement = "torch", match-runtime = true }]
transformer-engine-torch = [{ requirement = "torch", match-runtime = true }]
# grouped_gemm does not declare setuptools in build-system.requires; needed for prepare_metadata_for_build_wheel
# torch: nv-grouped-gemm has no PEP 621 dependency-metadata for match-runtime; pin to project torch
nv-grouped-gemm = ["setuptools", "torch==2.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steptronoss"]

[tool.mypy]
files = ["steptronoss"]
disable_error_code = ["assignment"]
disallow_any_unimported = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cpu: CPU-only tests",
    "gpu: GPU-only tests",
    "node2: requires 2 processes (torchrun --nproc-per-node=2)",
    "xdist_group(name): serialize tests that share the same torchrun resources",
    "mcore: tests that require the mcore extra",
]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    "E501",    # LineTooLong
    "E731",    # DoNotAssignLambda
    "S101",    # assert
    "TRY003",  # raise-vanilla-args
    "RUF003",  # ambiguous-unicode-character-comment
    "F401",    # unused-import
    "SIM102",  # collapsible-if
    "C408",    # unnecessary-collection-call
    "SIM108",  # if-else-block-instead-of-if-exp
    "C901",    # complex-structure
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF012",  # mutable-class-default
    "B905",    # zip-without-explicit-strict
    "E402",    # module-import-not-at-top-of-file
    "A002",    # builtin-argument-shadowing
    "E722",    # bare-except
    "RUF005",  # collection-literal-concatenation
    "S301",    # suspicious-pickle-usage
    "RUF001",  # ambiguous-unicode-character-string
    "RUF059",  # unused-unpacked-variable
    "S110",    # try-except-pass
    "TRY002",  # raise-vanilla-class
    "A001",    # builtin-variable-shadowing
    "S311",    # suspicious-non-cryptographic-random-usage
    "SIM105",  # suppressible-exception
    "F403",    # undefined-local-with-import-star
    "TRY300",  # try-consider-else
    "B006",    # mutable-argument-default
    "B904",    # raise-without-from-inside-except
    "F821",    # undefined-name
    "RUF015",  # unnecessary-iterable-allocation-for-first-element
    "TRY201",  # verbose-raise
    "B028",    # no-explicit-stacklevel
    "E741",    # ambiguous-variable-name
    "S104",    # hardcoded-bind-all-interfaces
    "SIM115",  # open-file-with-context-handler
    "A004",    # builtin-import-shadowing
    "PGH003",  # blanket-type-ignore
    "S108",    # hardcoded-temp-file
    "TRY301",  # raise-within-try
    "UP008",   # super-call-with-parameters
    "A006",    # builtin-lambda-argument-shadowing
    "B011",    # assert-false
    "B015",    # useless-comparison
    "B027",    # empty-method-without-abstract-decorator
    "F811",    # redefined-while-unused
    "S105",    # hardcoded-password-string
    "S324",    # hashlib-insecure-hash-function
    "S506",    # unsafe-yaml-load
    "S603",    # subprocess-without-shell-equals-true
    "S607",    # start-process-with-partial-path
    "SIM211",  # if-expr-with-false-true
    "T100",    # debugger
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["steptronoss"]

[tool.isort]
profile = "black"
line_length = 120
py_version = 310
known_first_party = "steptronoss"
known_third_party = "wandb"
